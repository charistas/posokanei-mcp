name: Weekly npm security audit

on:
  schedule:
    # 02:30 or 03:30 Athens time, depending on daylight saving time.
    - cron: "30 0 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: Audit lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=high
